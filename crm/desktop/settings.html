<!DOCTYPE html>
<html dir="rtl" lang="ar"><head><meta charset="utf-8">
<title>الإعدادات — NebrasCRM</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0F1420;--card:#1A2233;--line:#26314A;--line2:#324060;--txt:#E8EDF7;
  --mut:#8B98B4;--pri:#4F7CFF;--ok:#22C55E;--danger:#EF4444;--warn:#F59E0B}
body.light{--bg:#EEF2F8;--card:#FFFFFF;--line:#DDE4EE;--line2:#C3CDDD;--txt:#152033;--mut:#5A6B85;--pri:#2F5FE0}
body{background:var(--bg);color:var(--txt);font:13.5px/1.7 "Segoe UI",system-ui,Tahoma,sans-serif;
  padding:22px;-webkit-user-select:none}
h1{font-size:17px;font-weight:800;margin-bottom:3px}
.sub{color:var(--mut);font-size:12px;margin-bottom:18px}
.grp{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px;margin-bottom:12px}
.grp h2{font-size:12.5px;font-weight:800;margin-bottom:11px;color:var(--pri)}
label{display:block;font-size:11.5px;color:var(--mut);font-weight:700;margin-bottom:5px}
input[type=text],select{width:100%;background:var(--bg);border:1px solid var(--line2);color:var(--txt);
  border-radius:9px;padding:9px 11px;outline:none;font-family:inherit;font-size:13px}
input:focus,select:focus{border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 18%,transparent)}
.row{display:flex;gap:9px;align-items:center}
.chk{display:flex;align-items:center;gap:9px;padding:8px 0;cursor:pointer;font-size:13px}
.chk input{width:17px;height:17px;accent-color:var(--pri);cursor:pointer}
.btn{background:var(--card);border:1px solid var(--line2);color:var(--txt);border-radius:9px;
  padding:9px 15px;cursor:pointer;font-family:inherit;font-weight:700;font-size:12.5px;transition:.18s}
.btn:hover{border-color:var(--pri)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.foot{display:flex;gap:9px;justify-content:flex-end;margin-top:16px}
.st{font-size:11.5px;padding:7px 10px;border-radius:8px;margin-top:9px;display:none}
.st.ok{display:block;background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok);border:1px solid var(--ok)}
.st.no{display:block;background:color-mix(in srgb,var(--danger) 15%,transparent);color:var(--danger);border:1px solid var(--danger)}
.st.wait{display:block;background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn);border:1px solid var(--warn)}
.meta{color:var(--mut);font-size:11px;line-height:1.9;font-family:monospace;direction:ltr;text-align:left}
</style></head><body>

<h1 id="t-title">الإعدادات</h1>
<div class="sub" id="t-sub">تخصيص اتصال التطبيق وسلوكه</div>

<div class="grp">
  <h2 id="t-conn">الاتصال بالخادم</h2>
  <label id="t-url">عنوان الخادم</label>
  <div class="row">
    <input type="text" id="url" placeholder="http://localhost:8000" dir="ltr" style="text-align:left">
    <button class="btn" id="test" style="white-space:nowrap">اختبار</button>
  </div>
  <div class="st" id="status"></div>
</div>

<div class="grp">
  <h2 id="t-pref">التفضيلات</h2>
  <label id="t-lang">لغة القوائم</label>
  <select id="lang"><option value="ar">العربية</option><option value="en">English</option></select>
  <div style="height:11px"></div>
  <label class="chk"><input type="checkbox" id="tray"><span id="t-tray">إبقاء التطبيق في شريط المهام عند الإغلاق</span></label>
  <label class="chk"><input type="checkbox" id="minim"><span id="t-min">بدء التشغيل مصغّراً</span></label>
  <label class="chk"><input type="checkbox" id="hw"><span id="t-hw">تسريع الرسوميات بالعتاد</span></label>
</div>

<div class="grp">
  <h2 id="t-about">حول</h2>
  <div class="meta" id="meta">…</div>
</div>

<div class="foot">
  <button class="btn" id="cancel" >إلغاء</button>
  <button class="btn pri" id="save">حفظ</button>
</div>

<script>
const L={ar:{title:"الإعدادات",sub:"تخصيص اتصال التطبيق وسلوكه",conn:"الاتصال بالخادم",
  url:"عنوان الخادم",test:"اختبار",pref:"التفضيلات",lang:"لغة القوائم",
  tray:"إبقاء التطبيق في شريط المهام عند الإغلاق",min:"بدء التشغيل مصغّراً",
  hw:"تسريع الرسوميات بالعتاد",about:"حول",save:"حفظ",cancel:"إلغاء",
  ok:"✓ الخادم يعمل ويستجيب",no:"✕ تعذّر الوصول إلى الخادم",wait:"⏳ جارٍ الاختبار…",
  restart:"يتطلب إعادة تشغيل التطبيق"},
 en:{title:"Settings",sub:"Configure the app connection and behaviour",conn:"Server connection",
  url:"Server URL",test:"Test",pref:"Preferences",lang:"Menu language",
  tray:"Keep running in the tray when closed",min:"Start minimised",
  hw:"Hardware graphics acceleration",about:"About",save:"Save",cancel:"Cancel",
  ok:"✓ Server is up and responding",no:"✕ Could not reach the server",wait:"⏳ Testing…",
  restart:"Requires an app restart"}};
let cfg={},lang="ar",hwWas=true;
const $=id=>document.getElementById(id);

async function boot(){
  cfg=await nebrasDesktop.getConfig();
  lang=cfg.lang||"ar"; hwWas=cfg.hardwareAcceleration!==false;
  $("url").value=cfg.serverUrl||"";
  $("lang").value=lang;
  $("tray").checked=cfg.minimizeToTray!==false;
  $("minim").checked=!!cfg.startMinimized;
  $("hw").checked=hwWas;
  const i=await nebrasDesktop.appInfo();
  $("meta").textContent=`NebrasCRM ${i.version}\nElectron ${i.electron} · Chromium ${i.chrome}\n${i.platform} ${i.arch}`;
  paint();
}
function paint(){
  const t=L[lang];
  document.documentElement.lang=lang;document.body.dir=lang==="ar"?"rtl":"ltr";
  $("t-title").textContent=t.title; $("t-sub").textContent=t.sub;
  $("t-conn").textContent=t.conn;   $("t-url").textContent=t.url;
  $("test").textContent=t.test;     $("t-pref").textContent=t.pref;
  $("t-lang").textContent=t.lang;   $("t-tray").textContent=t.tray;
  $("t-min").textContent=t.min;     $("t-hw").textContent=t.hw;
  $("t-about").textContent=t.about; $("save").textContent=t.save;
  $("cancel").textContent=t.cancel;
}
$("lang").onchange=e=>{lang=e.target.value;paint();};
$("test").onclick=async()=>{
  const s=$("status"); s.className="st wait"; s.textContent=L[lang].wait;
  const r=await nebrasDesktop.testServer($("url").value);
  s.className="st "+(r.ok?"ok":"no");
  s.textContent=r.ok?L[lang].ok:`${L[lang].no}${r.error?" — "+r.error:""}`;
};
$("save").onclick=async()=>{
  const hwNow=$("hw").checked;
  await nebrasDesktop.setConfig({
    serverUrl:$("url").value.trim().replace(/\/+$/,""),
    lang, minimizeToTray:$("tray").checked,
    startMinimized:$("minim").checked, hardwareAcceleration:hwNow,
  });
  if(hwNow!==hwWas){ nebrasDesktop.relaunch(); return; }
  nebrasDesktop.closeSettings();
};
$("cancel").onclick=()=>nebrasDesktop.closeSettings();
boot();
</script></body></html>
