<!DOCTYPE html><html dir="rtl"><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:100vw;height:100vh;display:grid;place-items:center;background:transparent;
  font-family:"Segoe UI",system-ui,Tahoma,sans-serif;overflow:hidden;-webkit-user-select:none}
.card{width:400px;height:280px;border-radius:22px;display:grid;place-items:center;
  background:linear-gradient(140deg,#0F1420 0%,#141C33 55%,#1A1533 100%);
  border:1px solid rgba(255,255,255,.10);box-shadow:0 24px 60px rgba(0,0,0,.5);position:relative;overflow:hidden}
.card::before{content:"";position:absolute;width:300px;height:300px;border-radius:50%;
  background:#4F7CFF;filter:blur(80px);opacity:.35;top:-120px;inset-inline-start:-90px}
.card::after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;
  background:#7C3AED;filter:blur(80px);opacity:.32;bottom:-110px;inset-inline-end:-80px}
.in{position:relative;text-align:center;z-index:2}
.mk{width:82px;height:82px;margin:0 auto 16px;border-radius:21px;display:grid;place-items:center;
  background:linear-gradient(135deg,#4F7CFF,#2B4ACB 52%,#7C3AED);
  box-shadow:0 12px 32px rgba(43,74,203,.55),inset 0 0 0 1px rgba(255,255,255,.18);
  animation:pop .6s cubic-bezier(.2,.9,.3,1.4)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.mk svg{width:70%;height:70%;animation:flick 2.4s ease-in-out infinite}
@keyframes flick{50%{transform:scale(1.06) translateY(-1px)}}
h1{color:#fff;font-size:25px;font-weight:800;letter-spacing:-.4px}
.ar{color:#FFC53D;font-size:17px;font-weight:700;margin-top:3px}
.sub{color:#93A4C4;font-size:11.5px;margin-top:9px}
.bar{width:170px;height:3px;border-radius:9px;background:rgba(255,255,255,.13);
  margin:20px auto 0;overflow:hidden}
.bar i{display:block;height:100%;width:40%;border-radius:9px;
  background:linear-gradient(90deg,#4F7CFF,#FFC53D);animation:load 1.25s ease-in-out infinite}
@keyframes load{0%{transform:translateX(-110%)}100%{transform:translateX(330%)}}
</style></head><body><div class="card"><div class="in">
<div class="mk"><svg viewBox="0 0 64 64"><defs>
<linearGradient id="f" x1=".5" y1="0" x2=".5" y2="1"><stop offset="0" stop-color="#fff"/>
<stop offset=".55" stop-color="#FFF3D6"/><stop offset="1" stop-color="#FFC53D"/></linearGradient>
<linearGradient id="c" x1=".5" y1="0" x2=".5" y2="1"><stop offset="0" stop-color="#FFC53D"/>
<stop offset="1" stop-color="#FF9F1C"/></linearGradient></defs>

<path d="M32.6 26C33 30.4 37.2 32.6 38.6 36.6C39.8 40.1 38.4 44 35.3 45.9C32 47.9 27.4 47 25.3 43.9C23.2 40.8 23.8 37.2 25.6 34.6C26.6 36 27.6 36.6 28.5 36.7C28 32.6 29.8 28.9 32.6 26Z" fill="url(#c)"/></svg></div>
<h1>NebrasCRM</h1><div class="ar">نِبراس سي آر إم</div>
<div class="sub">منصة إدارة علاقات العملاء للمؤسسات</div>

</div></div></body></html>
