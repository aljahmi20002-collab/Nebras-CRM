<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NebrasCRM — بوابة الشركاء</title>
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="/brand/favicon/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/brand/favicon/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#2B4ACB"><text y='26' font-size='26'>◆</text></svg>">
<style>
.ashell{max-width:1140px;margin:0 auto;padding:0 18px 40px}
.atop{background:var(--bg2);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.atop .in{max-width:1140px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:12px}
.atabs{display:flex;gap:4px;margin:18px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.atabs button{background:none;border:none;padding:10px 15px;cursor:pointer;color:var(--mut);
  font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.atabs button.on{color:var(--txt);border-bottom-color:var(--pri)}
.ring{--p:0;width:96px;height:96px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--pri) calc(var(--p)*1%),var(--bg2) 0)}
.ring>div{width:76px;height:76px;border-radius:50%;background:var(--card);display:grid;place-items:center}
</style></head><body>
<script src="/agent.js"></script>
<script src="/printing.js"></script>
<script src="/pwa.js" defer></script>
</body></html>
