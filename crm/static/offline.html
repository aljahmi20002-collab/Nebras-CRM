<!DOCTYPE html>
<html dir="rtl" lang="ar"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>غير متصل — NebrasCRM</title>
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="/brand/favicon/favicon.svg" type="image/svg+xml">
<style>
.off{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
.off .card{max-width:460px;padding:38px 30px}
.mk{width:84px;height:84px;margin:0 auto 20px;border-radius:22px;display:grid;place-items:center;
  background:linear-gradient(135deg,#4F7CFF,#2B4ACB 52%,#7C3AED);
  box-shadow:0 10px 30px rgba(43,74,203,.4);position:relative}
.mk svg{width:70%;height:70%}
.mk::after{content:"";position:absolute;inset:-6px;border-radius:26px;border:2px solid var(--warn);
  opacity:.55;animation:ring 2.2s ease-out infinite}
@keyframes ring{0%{transform:scale(.94);opacity:.6}100%{transform:scale(1.12);opacity:0}}
.dot{display:inline-block;width:9px;height:9px;border-radius:99px;background:var(--danger);
  margin-inline-end:7px;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
.qbox{background:var(--bg2);border:1px dashed var(--line2);border-radius:12px;padding:14px;margin-top:16px}
</style></head>
<body>
<div class="off"><div class="card">
  <div class="mk"><svg viewBox="0 0 64 64" aria-hidden="true">
    <defs><linearGradient id="f" x1=".5" y1="0" x2=".5" y2="1">
      <stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#FFF3D6"/>
      <stop offset="1" stop-color="#FFC53D"/></linearGradient>
      <linearGradient id="c" x1=".5" y1="0" x2=".5" y2="1">
      <stop offset="0" stop-color="#FFC53D"/><stop offset="1" stop-color="#FF9F1C"/></linearGradient></defs>
    <path d="M33.4 8.2C33.9 15.6 40.1 18.6 43.6 24.4C46.9 29.9 47 36 45.1 40.7C42.6 47 37.6 51.4 31.6 51.4C24 51.4 17.4 45.6 17 37.4C16.7 31.3 20 27.6 22.6 24.9C24.2 27.4 25.9 28.6 27.4 28.8C26.2 22 28.6 14.2 33.4 8.2Z" fill="url(#f)"/>
    <path d="M32.6 26C33 30.4 37.2 32.6 38.6 36.6C39.8 40.1 38.4 44 35.3 45.9C32 47.9 27.4 47 25.3 43.9C23.2 40.8 23.8 37.2 25.6 34.6C26.6 36 27.6 36.6 28.5 36.7C28 32.6 29.8 28.9 32.6 26Z" fill="url(#c)"/>
  </svg></div>

  <div class="h1" style="font-size:21px;margin-bottom:8px" id="t1">لا يوجد اتصال بالإنترنت</div>
  <p class="mut" style="font-size:13.5px;line-height:2;margin-bottom:6px" id="t2">
    لا تقلق — بياناتك المحفوظة ما زالت متاحة للاطلاع، وأي تعديل تجريه الآن
    سيُحفظ ويُرسل تلقائياً فور عودة الشبكة.</p>

  <div class="row" style="justify-content:center;margin:16px 0">
    <span class="badge" style="color:var(--danger);background:var(--danger)22">
      <span class="dot"></span><span id="t3">غير متصل</span></span>
  </div>

  <div class="qbox" id="qbox" style="display:none">
    <b style="font-size:13px" id="t4">عمليات بانتظار الإرسال</b>
    <div style="font-size:26px;font-weight:800;color:var(--warn)" id="qn">0</div>
  </div>

  <div class="row" style="justify-content:center;gap:10px;margin-top:20px;flex-wrap:wrap">
    <button class="btn pri" id="retry">↻ <span id="t5">إعادة المحاولة</span></button>
    <a class="btn" href="/app" id="t6">فتح النسخة المحفوظة</a>
  </div>
  <div style="margin-top:16px"><a class="mut" id="lang" style="cursor:pointer;font-size:12.5px">English</a></div>
</div></div>

<script>
const L={ar:{t1:"لا يوجد اتصال بالإنترنت",
  t2:"لا تقلق — بياناتك المحفوظة ما زالت متاحة للاطلاع، وأي تعديل تجريه الآن سيُحفظ ويُرسل تلقائياً فور عودة الشبكة.",
  t3:"غير متصل",t4:"عمليات بانتظار الإرسال",t5:"إعادة المحاولة",t6:"فتح النسخة المحفوظة",sw:"English"},
 en:{t1:"You're offline",
  t2:"Don't worry — your cached data is still viewable, and any change you make now is saved and sent automatically once you reconnect.",
  t3:"Offline",t4:"Pending operations",t5:"Retry",t6:"Open cached version",sw:"العربية"}};
let lang=localStorage.getItem("lang")||"ar";
function paint(){
  document.documentElement.lang=lang;document.body.dir=lang==="ar"?"rtl":"ltr";
  document.body.className=(localStorage.getItem("theme")||"dark")==="light"?"light":"";
  for(const k of ["t1","t2","t3","t4","t5","t6"]){const e=document.getElementById(k);if(e)e.textContent=L[lang][k];}
  document.getElementById("lang").textContent=L[lang].sw;
}
document.getElementById("lang").onclick=()=>{lang=lang==="ar"?"en":"ar";localStorage.setItem("lang",lang);paint();};
document.getElementById("retry").onclick=()=>location.reload();
addEventListener("online",()=>location.href="/app");
// show the pending-write queue depth
navigator.serviceWorker?.ready.then(r=>{
  navigator.serviceWorker.addEventListener("message",e=>{
    if(e.data?.type==="queue-size"&&e.data.n>0){
      document.getElementById("qbox").style.display="block";
      document.getElementById("qn").textContent=e.data.n;}});
  r.active?.postMessage({type:"queue-size"});
});
paint();
</script></body></html>
