<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NebrasCRM — Customer Portal</title>
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="/brand/favicon/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/brand/favicon/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#2B4ACB"><text y='26' font-size='26'>◆</text></svg>">
<style>
.pshell{max-width:1080px;margin:0 auto;padding:0 18px 40px}
.ptop{background:var(--bg2);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.ptop .in{max-width:1080px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:12px}
.ptabs{display:flex;gap:4px;margin:18px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.ptabs button{background:none;border:none;padding:10px 16px;cursor:pointer;color:var(--mut);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.ptabs button.on{color:var(--txt);border-bottom-color:var(--pri)}
.msg{padding:11px 13px;border-radius:12px;margin-bottom:9px;max-width:78%}
.msg.customer{background:var(--pri)22;border:1px solid var(--pri)55;margin-inline-start:auto}
.msg.staff{background:var(--bg2);border:1px solid var(--line)}
</style>
</head><body>
<script src="/portal.js"></script>
<script src="/pwa.js" defer></script>
</body></html>
